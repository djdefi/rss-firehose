# This is a basic workflow to help you get started with Actions

name: Auto pages deploy

# Controls when the action will run. Triggers the workflow on push 
# events but only for the main branch and on a schedule
on:
  workflow_dispatch:  # Allows manual triggering of the workflow
    inputs:
      force_regenerate:
        description: 'Force full regeneration (skip cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      ai_model:
        description: 'Local model used for summaries'
        required: false
        default: 'lfm2.5-2.6b'
        type: choice
        options:
          - 'lfm2.5-2.6b'
          - 'lfm2.5-1.2b'
  push:  # Triggers the workflow on push events to the main branch
    branches: [ main ]
  schedule:  # Triggers the workflow on a schedule (twice a day)
    - cron:  '0 3,15 * * *'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pages-build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    # Restores the most recent AI summary cache. A per-run key with a shared
    # restore prefix is used so the cache actually refreshes: exact-key restore
    # misses (unique per run) and falls back to the newest `ai-summary-` entry,
    # while the save step below always writes a new key. (A single static key is
    # immutable once written and would freeze the cache forever.)
    - name: Restore AI summary cache
      id: cache-ai-summary
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cache
        key: ai-summary-${{ github.run_id }}
        restore-keys: |
          ai-summary-

    - name: Restore local AI runtime
      id: cache-local-ai
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .local-ai
        key: local-ai-llama-b10298-${{ github.event.inputs.ai_model || 'lfm2.5-2.6b' }}-v1

    - name: Install local AI runtime
      if: steps.cache-local-ai.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .local-ai/llama .local-ai/models

        curl -fsSL \
          https://github.com/ggml-org/llama.cpp/releases/download/b10298/llama-b10298-bin-ubuntu-x64.tar.gz \
          -o "$RUNNER_TEMP/llama.tar.gz"
        echo "c8c7a1e7ff36c92eac16440e224b82afbee9caef843a9aa84ba1e5a9f0329af4  $RUNNER_TEMP/llama.tar.gz" |
          sha256sum --check
        tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C .local-ai/llama --strip-components=1

        case "${AI_MODEL_VARIANT}" in
          lfm2.5-1.2b)
            model_url="https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/76022b8bfa64af5862d6bce90a676c3cc9b17b52/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
            model_file=".local-ai/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
            model_sha="b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5"
            ;;
          lfm2.5-2.6b)
            model_url="https://huggingface.co/LiquidAI/LFM2.5-2.6B-GGUF/resolve/b421ad1d549afeda6a0fb2ad3a697cb5a7879adc/LFM2.5-2.6B-Q4_K_M.gguf"
            model_file=".local-ai/models/LFM2.5-2.6B-Q4_K_M.gguf"
            model_sha="79fdf00351b46cf26f020aead28d01889886be87c55fa0eb907e6f9b00bfee14"
            ;;
          *)
            echo "Unsupported AI model: ${AI_MODEL_VARIANT}" >&2
            exit 1
            ;;
        esac
        curl -fsSL "$model_url" -o "$model_file"
        echo "$model_sha  $model_file" | sha256sum --check
      env:
        AI_MODEL_VARIANT: ${{ github.event.inputs.ai_model || 'lfm2.5-2.6b' }}

    - name: Save local AI runtime
      if: steps.cache-local-ai.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .local-ai
        key: local-ai-llama-b10298-${{ github.event.inputs.ai_model || 'lfm2.5-2.6b' }}-v1

    # Sets up Ruby environment
    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: .ruby-version # Single source of truth: .ruby-version
        bundler-cache: true
        
    # Runs the Ruby script to render the page
    - name: Render with local LFM2.5 summaries
      shell: bash
      run: |
        set -euo pipefail
        case "${AI_MODEL_VARIANT}" in
          lfm2.5-1.2b)
            model_file=".local-ai/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
            ;;
          lfm2.5-2.6b)
            model_file=".local-ai/models/LFM2.5-2.6B-Q4_K_M.gguf"
            ;;
          *)
            echo "Unsupported AI model: ${AI_MODEL_VARIANT}" >&2
            exit 1
            ;;
        esac
        .local-ai/llama/llama-server \
          --model "$model_file" \
          --alias "$AI_MODEL_VARIANT" \
          --host 127.0.0.1 \
          --port 8080 \
          --ctx-size 4096 \
          --parallel 1 \
          --threads 4 \
          --reasoning off \
          --reasoning-budget 0 \
          --no-webui \
          > "$RUNNER_TEMP/llama-server.log" 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

        for _ in {1..90}; do
          curl -fsS http://127.0.0.1:8080/health >/dev/null && break
          sleep 2
        done
        if ! curl -fsS http://127.0.0.1:8080/health >/dev/null; then
          cat "$RUNNER_TEMP/llama-server.log"
          exit 1
        fi

        bundle exec ruby render.rb
        if ! kill -0 "$server_pid" 2>/dev/null; then
          echo "llama-server stopped during rendering" >&2
          cat "$RUNNER_TEMP/llama-server.log"
          exit 1
        fi
        if grep -q "Summary generation failed" public/index.html; then
          echo "Refusing to deploy summary error placeholders" >&2
          exit 1
        fi
      env:
        AI_API_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions
        AI_MODEL: ${{ github.event.inputs.ai_model || 'lfm2.5-2.6b' }}
        AI_MODEL_VARIANT: ${{ github.event.inputs.ai_model || 'lfm2.5-2.6b' }}
        AI_REQUEST_TIMEOUT: '240'
        FEED_CONCURRENCY: '2'
        FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
        RENDER_REGIONAL: '1' # Also build public/regional.html from urls-regional.txt

    # Saves the AI summary cache under a fresh per-run key so it always updates.
    # Old entries are evicted by GitHub's cache retention policy.
    - name: Save AI summary cache
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cache
        key: ai-summary-${{ github.run_id }}

    # Runs a Git AV scan
    - name: Git AV Scan
      if: success()
      uses: djdefi/gitavscan@10738a745366c8cb8443cd4f9cbeeebcc3328975 # 20

    # Checks the rendered HTML for issues
    - name: Check Rendered HTML
      if: success()
      uses: chabad360/htmlproofer@a1a3419200cea0e832a5c6249647d1d271178e82 # master
      continue-on-error: true
      with:
        directory: "./public"
        arguments: "--disable-external"

    # Deploys the site to GitHub Pages
    - name: GitHub Pages
      if: success()
      uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
      with:
        build_dir: public
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
