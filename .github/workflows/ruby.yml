# Runs the render test suite and a syntax check on every push / PR to main.
name: Ruby CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Syntax check
      run: ruby -c render.rb && ruby -c server.rb

    - name: Run tests
      run: ruby -Itest test/render_test.rb
